c_compiler:
  - clang_bootstrap            # [osx]
  - vs2022                     # [win]
cxx_compiler:
  - clang_bootstrap            # [osx]
  - vs2022                     # [win]

# macOS builds with the released clang_bootstrap (LLVM 22); release-first order of the LLVM 23 chain
c_compiler_version:
  - 11.2.0            # [linux]
  - 22.1.2            # [osx]
cxx_compiler_version:
  - 11.2.0            # [linux]
  - 22.1.2            # [osx]

# Starting from LLVM 14, the ABI of libclang doesn't necessarily
# match the major version anymore - cf. #170 and
# https://github.com/llvm/llvm-project/issues/54004
libclang_soversion:
  - 13

variant:
  - default
# For future compatibility with AMD ROCm
# https://github.com/ROCm/hcc
#  - hcc   # [linux]

libxml2:
  - 2.15.3
