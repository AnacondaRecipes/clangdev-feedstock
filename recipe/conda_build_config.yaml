c_compiler:
  - clang_bootstrap            # [osx]
  - vs2022                     # [win]
cxx_compiler:
  - clang_bootstrap            # [osx]
  - vs2022                     # [win]

# macOS builds with clang_bootstrap 23 (self-hosted rebuild; 23.1.4 build 0 used clang_bootstrap 22)
c_compiler_version:
  - 11.2.0            # [linux]
  - 23.1.4            # [osx]
cxx_compiler_version:
  - 11.2.0            # [linux]
  - 23.1.4            # [osx]

# Starting from LLVM 14, the ABI of libclang doesn't necessarily
# match the major version anymore - cf. #170 and
# https://github.com/llvm/llvm-project/issues/54004
libclang_soversion:
  - 13

variant:
  - default
# For future compatibility with AMD ROCm
# https://github.com/ROCm/hcc
#  - hcc   # [linux]

libxml2:
  - 2.15.3
